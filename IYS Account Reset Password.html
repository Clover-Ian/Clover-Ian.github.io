<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose a new password for your IYS account.">
    <title>Reset Password | IYS Account</title>
    <link rel="icon" type="image/png" href="IYS.png">
    <link rel="apple-touch-icon" href="IYS.png">
    <link rel="stylesheet" href="style.css">
    <script src="supabase.js" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="account-nav.js" defer></script>
    <script src="account-reset.js" defer></script>
</head>
<body class="corner-background">
    <header class="site-header">
        <nav class="navigation" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="IYS home">IYS</a>
            <div class="nav-links">
                <a href="IYS Software.html">Software</a>
                <a href="IYM.html">IYM</a>
                <a href="IYS Studio.html">Studio</a>
                <a href="IYS Website.html">Website</a>
                <a href="mailto:iys-ian@outlook.com">Contact</a>
                <a class="account-nav-link" href="IYS Account Sign In.html">Sign in</a>
                <a class="account-nav-link account-signup-link" href="IYS Account Sign Up.html">Sign up</a>
            </div>
        </nav>
    </header>

    <main class="account-section content-width">
        <section class="account-card" aria-labelledby="account-heading">
            <p class="eyebrow">Almost there</p>
            <h1 id="account-heading">Choose a new password.</h1>
            <p class="account-intro">Enter a new password for your IYS account.</p>

            <form class="account-form" data-reset-form>
                <label for="reset-password">New password</label>
                <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

                <label for="reset-confirmation">Confirm new password</label>
                <input id="reset-confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

                <p class="account-feedback" role="alert" hidden></p>
                <button class="account-submit" type="submit">Update password</button>
            </form>

            <p class="account-switch">Back to <a href="IYS Account Sign In.html">sign in</a>.</p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p><a href="index.html">Back to IYS</a></p>
            <nav class="footer-policy-links" aria-label="Policies">
                <a href="terms.html">Terms of Service</a>
                <a href="privacy.html">Privacy Policy</a>
                <a href="refund.html">Refund Policy</a>
            </nav>
            <p class="copyright">© IYS. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
