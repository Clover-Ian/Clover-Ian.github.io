<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>IYS — Inbox</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
    <link rel="stylesheet" href="style.css?v=20261127k">
    <style>
        /* 收件箱专用布局：写在页面里，不依赖外部 CSS 缓存 */
        body.inbox-page .account-section {
            padding: 32px 0 40px;
            align-items: stretch;
        }
        body.inbox-page .inbox-card {
            width: min(100%, 980px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: calc(100dvh - 150px);
            overflow: hidden;
            padding-bottom: 28px;
        }
        body.inbox-page .inbox-thread {
            flex: 1 1 auto;
            min-height: 0;
            max-height: none;
            overflow-y: auto;
        }
        body.inbox-page .inbox-form {
            flex: 0 0 auto;
            margin-top: 0;
        }
        body.inbox-page .account-submit {
            margin-bottom: 0;
        }
    </style>

    <script src="supabase.js?v=20261116d" defer></script>
    <script src="supabase-config.js?v=20261116d" defer></script>
    <script src="account-nav.js?v=20261127e" defer></script>
    <script src="ai-assistant.js?v=20261127g" defer></script>
    <script src="messages.js?v=20261116e" defer></script>
    <script src="mega-menu.js?v=20261127c" defer></script>
    <script src="presence.js?v=20261118d" defer></script>
    <script src="inbox.js?v=20261116d" defer></script>
    <script src="scroll-center.js?v=20261126a" defer></script>
</head>
<body class="corner-background inbox-page">
    <header class="site-header">
        <nav class="navigation" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="IYS home">IYS</a>
            <div class="nav-links">
                <a href="#" data-ai-open>IYS AI</a>
                <a href="IYM.html">IYM</a>
                <a href="IYS Software.html">Software</a>
                <a href="IYS Studio.html">Studio</a>
                <a href="IYS Website.html" data-mega="explore">Website</a>
                <a class="account-nav-link" href="IYS Account Sign In.html">Sign in</a>
                <a class="account-nav-link account-signup-link" href="IYS Account Sign Up.html">Sign up</a>
            </div>
        </nav>
    </header>

    <main class="account-section content-width">
        <section class="account-card inbox-card">
            <p class="eyebrow">Messages</p>
            <h1>Inbox.</h1>
            <p class="account-intro">Messages from IYS appear here. You can reply directly.</p>

            <p class="account-feedback" data-inbox-feedback role="alert" hidden></p>
            <p class="inbox-gate" data-inbox-gate hidden>Sign in to see your messages.</p>

            <div class="inbox-thread" data-inbox-thread hidden></div>

            <form class="account-form inbox-form" data-inbox-form hidden>
                <label for="inbox-reply">Reply</label>
                <textarea id="inbox-reply" name="body" rows="3" maxlength="1200" required
                          placeholder="Write a reply…"></textarea>
                <button class="account-submit" type="submit">Send reply</button>
            </form>
        </section>
    </main>
</body>
</html>
