<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>IYS — Staff</title>
    <link rel="icon" type="image/png" href="IYS.png">
    <link rel="apple-touch-icon" href="IYS.png">
    <link rel="stylesheet" href="style.css">
    <script src="supabase.js" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="account-nav.js" defer></script>
    <script src="admin.js" defer></script>
</head>
<body class="corner-background">
    <header class="site-header">
        <nav class="navigation" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="IYS home">IYS</a>
            <div class="nav-links">
                <a href="IYM.html">IYM</a>
                <a href="IYS Software.html">Software</a>
                <a href="IYS Studio.html">Studio</a>
                <a href="IYS Website.html">Website</a>
                <a class="account-nav-link" href="IYS Account Sign In.html">Sign in</a>
                <a class="account-nav-link account-signup-link" href="IYS Account Sign Up.html">Sign up</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="account-card admin-card">
            <p class="eyebrow">IYS staff</p>
            <h1>Announcements.</h1>
            <p class="account-intro">
                Post a note for everyone who visits the site. Only staff accounts can open this page.
            </p>

            <p class="account-feedback" data-admin-feedback role="alert" hidden></p>
            <p class="admin-gate" data-admin-gate hidden>Checking your account…</p>

            <div data-admin-panel hidden>
                <form class="account-form admin-form" data-admin-form>
                    <label for="admin-title">Title</label>
                    <input id="admin-title" name="title" type="text" maxlength="120" required
                           placeholder="A short headline">

                    <label for="admin-body">Message</label>
                    <textarea id="admin-body" name="body" rows="4" maxlength="1200" required
                              placeholder="What would you like to tell people?"></textarea>

                    <label for="admin-level">Type</label>
                    <select id="admin-level" name="level">
                        <option value="info">Info</option>
                        <option value="update">Update</option>
                        <option value="important">Important</option>
                    </select>

                    <button class="account-submit" type="submit">Publish</button>
                </form>

                <h2 class="admin-list-title">Published</h2>
                <div class="admin-list" data-admin-list></div>
            </div>
        </section>
    </main>
</body>
</html>
