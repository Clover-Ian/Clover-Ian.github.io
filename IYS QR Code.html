<body class="theme-dark">
    <header class="site-header">
        <nav class="navigation" aria-label="Main navigation">
            <a class="brand" href="index.html" aria-label="IYS home">IYS</a>
            <div class="nav-links">
                <a class="account-nav-link" href="IYS Account Sign In.html">Sign in</a>
                <a class="account-nav-link account-signup-link" href="IYS Account Sign Up.html">Sign up</a>

        <section class="tool-wrap">
            <p class="eyebrow">Developer · QR code</p>
            <h1>QR code generator.</h1>
            <p class="hero-copy">Make a QR code for a link or any text. Generated in your browser — nothing is uploaded.</p>

            <div class="tool-card" style="margin-top:26px">
                <div class="tool-field">
                    <label for="qr-text">Text or link</label>
                    <textarea id="qr-text" style="min-height:90px;font-family:inherit;font-size:14px" placeholder="https://clover-ian.github.io">https://clover-ian.github.io</textarea>
                </div>

                <div class="tool-row" style="margin-top:16px">
                    <div class="tool-field">
                        <label for="qr-size">Size (px)</label>
                        <input id="qr-size" type="number" min="128" max="1600" step="32" value="512">
                    </div>
                    <div class="tool-field">
                        <label for="qr-ec">Error correction</label>
                        <select id="qr-ec">
                            <option value="L">L — smallest</option>
                            <option value="M" selected>M — balanced</option>
                            <option value="Q">Q — sturdier</option>
                            <option value="H">H — most robust</option>
                        </select>
                    </div>
                    <div class="tool-field">
                        <label for="qr-margin">Quiet zone</label>
                        <input id="qr-margin" type="number" min="0" max="8" value="4">
                    </div>
                    <div class="tool-field">
                        <label for="qr-color">Colour</label>
                        <input id="qr-color" type="color" value="#1d1d1f" style="height:42px;padding:4px">
                    </div>
                </div>

                <div class="tool-row" style="margin-top:18px">
                    <button class="tool-button" id="qr-download">Download PNG</button>
                    <button class="tool-button tool-button--ghost" id="qr-copy">Copy image</button>
                    <span class="tool-note" id="qr-status"></span>
                </div>

                <div style="margin-top:22px;display:grid;place-items:center">
                    <canvas id="qr-canvas" width="512" height="512"
                            style="max-width:100%;border-radius:14px;border:1px solid var(--line);background:#fff"></canvas>
                </div>
            </div>
</main>

<script>
(() => {
  const field = document.getElementById('codec-text');
  const status = document.getElementById('codec-status');

  function note(message) {
    status.textContent = message;
    window.setTimeout(() => { status.textContent = ''; }, 1800);
  }

  const actions = {
    b64e: () => btoa(String.fromCharCode(...new TextEncoder().encode(field.value))),
    b64d: () => new TextDecoder().decode(Uint8Array.from(atob(field.value.trim()), (c) => c.charCodeAt(0))),
    urle: () => encodeURIComponent(field.value),
    urld: () => decodeURIComponent(field.value),
  };

  document.querySelectorAll('[data-act]').forEach((button) => {
    button.addEventListener('click', async () => {
      const act = button.dataset.act;

      if (act === 'copy') {
        try {
          await navigator.clipboard.writeText(field.value);
          note('Copied.');
        } catch { note('Copy failed.'); }
        return;
      }

      try {
        field.value = actions[act]();
        note('Done.');
      } catch {
        note('That input is not valid for this operation.');
      }
    });
  });
})();
</script>


    <script src="vendor/qrcode.js"></script>
    <script>
    (() => {
      const text = document.getElementById('qr-text');
      const size = document.getElementById('qr-size');
      const ec = document.getElementById('qr-ec');
      const margin = document.getElementById('qr-margin');
      const color = document.getElementById('qr-color');
      const canvas = document.getElementById('qr-canvas');
      const status = document.getElementById('qr-status');

      function render() {
        const value = text.value.trim();
        if (!value) {
          status.textContent = 'Type something first.';
          return;
        }

        let qr;
        try {
          qr = qrcode(0, ec.value);
          qr.addData(value);
          qr.make();
        } catch (error) {
          status.textContent = 'Too much text for a single QR code.';
          return;
        }

        status.textContent = '';

        const count = qr.getModuleCount();
        const quiet = Number(margin.value);
        const total = count + quiet * 2;
        const px = Math.max(128, Number(size.value) || 512);
        const cell = Math.floor(px / total);

        canvas.width = cell * total;
        canvas.height = cell * total;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = color.value;

        for (let row = 0; row < count; row += 1) {
          for (let col = 0; col < count; col += 1) {
            if (!qr.isDark(row, col)) continue;
            ctx.fillRect((col + quiet) * cell, (row + quiet) * cell, cell, cell);
          }
        }
      }

      [text, size, ec, margin, color].forEach((el) => {
        el.addEventListener('input', render);
        el.addEventListener('change', render);
      });

      document.getElementById('qr-download').addEventListener('click', () => {
        canvas.toBlob((blob) => {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'iys-qr-code.png';
          link.click();
          URL.revokeObjectURL(link.href);
        }, 'image/png');
      });

      document.getElementById('qr-copy').addEventListener('click', async () => {
        try {
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          status.textContent = 'Copied.';
        } catch {
          status.textContent = 'Copy failed — use Download.';
        }
      });

      render();
    })();
    </script>
</body>
</html>
